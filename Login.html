<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - StudentHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
</nav>

<h1>🔐 Student Login</h1>

<div class="login-box">

    <input
        type="text"
        id="loginName"
        placeholder="Enter your name"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
    >

    <button onclick="loginStudent()">Login</button>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script>
function loginStudent() {

    let name = document.getElementById("loginName").value.trim();
    let password = document.getElementById("loginPassword").value;

    let savedName = localStorage.getItem("studentName");
    let savedPassword = localStorage.getItem("studentPassword");

    if (name === savedName && password === savedPassword) {

    localStorage.setItem("isLoggedIn", "true");

    alert("Login successful!");

    window.location.href = "dashboard.html";

}
        
        else {

        alert("Invalid name or password. Please register first.");

    }
}
</script>

</body>
</html>
