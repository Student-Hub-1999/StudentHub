<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - StudentHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="Login.html">Login</a>
</nav>

<h1>📝 Student Registration</h1>

<div class="login-box">

    <input
        type="text"
        id="studentName"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="studentEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="studentPassword"
        placeholder="Create Password"
    >

    <button type="button" onclick="togglePassword()">
        👁️ Show Password
    </button>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
    >

    <button onclick="registerStudent()">Register</button>

    <p>
        Already have an account?
        <a href="Login.html">Login</a>
    </p>

</div>

<script>

function togglePassword() {

    let password = document.getElementById("studentPassword");
    let button = event.target;

    if (password.type === "password") {

        password.type = "text";
        button.innerHTML = "🙈 Hide Password";

    } else {

        password.type = "password";
        button.innerHTML = "👁️ Show Password";

    }
}


function registerStudent() {

    let name = document.getElementById("studentName").value.trim();
    let email = document.getElementById("studentEmail").value.trim();
    let password = document.getElementById("studentPassword").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (name === "") {

        alert("Please enter your name.");
        return;

    }

    if (email === "") {

        alert("Please enter your email.");
        return;

    }

    if (!email.includes("@") || !email.includes(".")) {

        alert("Please enter a valid email address.");
        return;

    }

    if (password === "") {

        alert("Please create a password.");
        return;

    }

    if (password.length < 6) {

        alert("Password must be at least 6 characters.");
        return;

    }

    if (confirmPassword === "") {

        alert("Please confirm your password.");
        return;

    }

    if (password !== confirmPassword) {

        alert("❌ Passwords do not match.");
        return;

    }

    localStorage.setItem("studentName", name);
    localStorage.setItem("studentEmail", email);
    localStorage.setItem("studentPassword", password);

    alert("✅ Registration successful!");

    window.location.href = "Login.html";
}

</script>

</body>
</html>
