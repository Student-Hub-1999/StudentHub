<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Result - StudentHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Test Result</h1>

<div class="card">

    <h2>🎉 Your Result</h2>

    <p>
        <strong>Score:</strong>
        <span id="score">No result available</span>
    </p>

    <p>
        <strong>Percentage:</strong>
        <span id="percentage">No result available</span>
    </p>

    <p>
        <strong>Result:</strong>
        <span id="status">No result available</span>
    </p>

</div>

<div class="card">

    <h3>📚 Keep Practicing!</h3>

    <p>
        Continue practicing mock tests and improve your score.
    </p>

</div>

<br>

<a href="dashboard.html">
    <button>📊 Back to Dashboard</button>
</a>

<br><br>

<a href="quiz.html">
    <button>🔄 Try Again</button>
</a>

<script>

/* =========================
   GET SAVED QUIZ RESULT
========================= */

let score = localStorage.getItem("quizScore");
let total = localStorage.getItem("quizTotal");
let percentage = localStorage.getItem("quizPercentage");


/* =========================
   SHOW SCORE
========================= */

if (score !== null && total !== null) {

    document.getElementById("score").innerHTML =
        score + " / " + total;
}


/* =========================
   SHOW PERCENTAGE
========================= */

if (percentage !== null) {

    document.getElementById("percentage").innerHTML =
        percentage + "%";
}


/* =========================
   SHOW PASS / FAIL
========================= */

if (percentage !== null) {

    let percent = Number(percentage);

    if (percent >= 50) {

        document.getElementById("status").innerHTML =
            "✅ PASS";

    } else {

        document.getElementById("status").innerHTML =
            "❌ FAIL";
    }
}


/* =========================
   DARK MODE
========================= */

let savedTheme = localStorage.getItem("theme");

if (savedTheme === "dark") {

    document.body.classList.add("dark-mode");
}

</script>

</body>
</html>
